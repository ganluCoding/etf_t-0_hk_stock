[project]
name = "hk-etf-t0-research"
version = "0.1.0"
description = "Reproducible research for manually traded Hong Kong ETF T+0 strategies."
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
  "akshare>=1.18",
  "curl-cffi>=0.13",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyside6-essentials>=6.8,<7",
]

[dependency-groups]
dev = [
  "dvc>=3,<4",
  "pytest>=8,<9",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
